<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechPulse</title>
  <meta name="description" content="Yazılım, yapay zeka ve siber güvenlikte son gelişmeler — saatlik güncellenen haber akışı.">
  <meta name="theme-color" content="#0b0f17">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f7cff'/><path d='M5 17h6l3-8 4 14 3-6h6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const th = localStorage.getItem('tp-theme'); if (th) document.documentElement.dataset.theme = th; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./" aria-label="TechPulse">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M5 17h6l3-8 4 14 3-6h6"/></svg>
        <span class="brand-text"><strong>TechPulse</strong><small data-i18n="tagline"></small></span>
      </a>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search" data-i18n-aria="searchLabel">
        <kbd>/</kbd>
      </div>
      <div class="actions">
        <div class="lang-toggle" role="group" data-i18n-aria="language">
          <button type="button" data-lang="tr">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" id="themeBtn" class="icon-btn" data-i18n-aria="theme" data-i18n-title="theme">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <nav class="wrap tabs" id="tabs" aria-label="Categories"></nav>
  </header>

  <main class="wrap">
    <section class="statusbar">
      <div class="live"><span class="pulse" aria-hidden="true"></span><span id="updated"></span></div>
      <div class="filters">
        <select id="sourceFilter" aria-label="Source"></select>
        <select id="timeFilter" aria-label="Time">
          <option value="0" data-i18n="anyTime"></option>
          <option value="1" data-i18n="last24h"></option>
          <option value="7" data-i18n="last7d"></option>
          <option value="30" data-i18n="last30d"></option>
        </select>
      </div>
    </section>

    <button type="button" id="newPill" class="new-pill" hidden></button>

    <section id="statsRow" class="stats" aria-live="polite"></section>

    <section id="trendingSec" class="block" hidden>
      <h2 data-i18n="trending"></h2>
      <div id="trending" class="trending"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2 id="listTitle" data-i18n="latest"></h2>
        <span id="showing" class="muted"></span>
      </div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="emptyState" class="empty" hidden></div>
      <div class="more"><button type="button" id="moreBtn" class="btn" hidden data-i18n="loadMore"></button></div>
    </section>
  </main>

  <footer class="wrap footer">
    <p data-i18n="footer"></p>
    <details id="sourcesDetails">
      <summary data-i18n="sourcesStatus"></summary>
      <ul id="sourcesList" class="sources-list"></ul>
    </details>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
